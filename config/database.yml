default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: db
  username: postgres
  password: password

development:
  <<: *default
  database: myapp_development

test:
  <<: *default
  database: myapp_test

production:
  primary:
    <<: *default
    url: <%= ENV['DB_URL'] %>
  cable:
    <<: *default
    url: <%= ENV['DB_URL'] %>
  queue:
    <<: *default
    url: <%= ENV['DB_URL'] %>
  cache:
    <<: *default
    url: <%= ENV['DB_URL'] %>